name: Validate simulator

on:
  push:
    branches:
      - main
      - fix/fpv-flight-physics
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run simulation unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
